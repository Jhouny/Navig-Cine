<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>FilmFinderz</title>
    <link rel="stylesheet" href="static/style.css">
    <link rel="icon" type="image/x-icon" href="static/image.png">
</head>
<body>

<header>
    <h1>🎬 FilmFinderz</h1>
    <p>Découvrez et notez des films pour obtenir des recommandations intelligentes</p>
</header>

<section class="film-list">

    <div class="film-card" data-film="Inception" data-category="science-fiction">
        <img src="https://picsum.photos/800/400?random=1">
        <div class="film-content">
            <h3>Inception</h3>
            <p>Un thriller de science-fiction explorant les rêves et la manipulation de l’esprit.</p>
            <div class="hearts"></div>
        </div>
    </div>

    <div class="film-card" data-film="Amelie" data-category="romance">
        <img src="https://picsum.photos/800/400?random=2">
        <div class="film-content">
            <h3>Le Fabuleux Destin d’Amélie Poulain</h3>
            <p>Une comédie romantique poétique au cœur de Paris.</p>
            <div class="hearts"></div>
        </div>
    </div>

</section>

<div class="actions">
    <button onclick="sendRatings()">Obtenir mes recommandations</button>
</div>

<script src="/static/script.js"></script>
</body>
</html>
